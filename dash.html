<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dash board</title>
  </head>
  <style>
    body {
      margin: 0%;
      padding: 0;
    }
    .navlist {
      display: flex;
      flex-direction: row;
      gap: 20px;
    }
    .cont {
        height: 100%;
      display: grid;
      grid-template-columns: 0.51fr 5fr;
      grid-template-rows: 30px 100%;
    }
    .header {
      background-color: rgb(31, 99, 133);
      grid-column: span 5;
      display: flex;
      flex-direction: row;
      color: rgb(201, 216, 205);
      flex-wrap: nowrap;
      justify-content: space-between;
      padding: 5px 5px 5px 5px;
    }
    .main {
      background-color: rgb(96, 102, 92);
      grid-column: span 4;
      margin-left: 2px;
      display: grid;
      grid-template-columns: 50% 50%;
      color: white;
      padding-top: 05px;
      padding-left: 05px;
      column-gap: 1px;
      row-gap: 4px;
    }
    .sidebar {
      background-color: rgb(29, 47, 41);
text-align: start;
padding-left: 2px ;
      color: white ;

    }
    .shape {
      border-radius: 10px;
      text-align: center;
    }
  </style>
  <body>
    <div class="cont">
      <div class="header">
        <div>
          <h>My Dashboard</h>
        </div>
        <div class="navlist">
          <div>
            <h>JAYESH</h>
          </div>
          <div>
            <h>Search..</h>
          </div>
        </div>
      </div>
      <div class="sidebar">
        <li>Home</li>
        <li>Account</li>
        <li>Applications</li>
        <li>Activity</li>
        <li>Record</li>
      </div>
      <div class="main">
        <div class="shape" style="background-color: red">1</div>
        <div class="shape" style="background-color: aqua">2</div>
        <div class="shape" style="background-color: rgb(180, 136, 83)">3</div>
        <div class="shape" style="background-color: brown">4</div>
        <div
          class="shape"
          style="background-color: rgb(177, 166, 149); grid-column: span 2"
        >
          5
        </div>
      </div>
    </div>
  </body>
</html>

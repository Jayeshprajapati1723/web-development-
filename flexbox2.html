<!-- justify content in flex box justify content : start /end /center/space around /space between / space evenly -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      /* background-image: url("bg.png");

    background-size:contain ; */
      background-color: darkmagenta;
    }

    .container1 {
      height: 200px;
      width: 300px;

      margin-top: 10px;

      background-color: rgb(129, 184, 109);

      display: flex;

      flex-direction: row;

      /* ye bhi by default hi h  */
      justify-content: start;
    }
    .box {
      height: 50px;
      width: 50px;

      margin-top: 10px;

      background-color: rgb(6, 23, 8);

      color: white;

      margin-left:5PX;
    }

    .container2 {
      height: 200px;
      width: 300px;

      background-color: rgb(191, 127, 169);

      display: flex;

      flex-direction: row;

      margin-top: 10px;

      /* ye bhi by default hi h  */
      justify-content: end;
    }

    .container3 {
      height: 200px;
      width: 300px;

      background-color: rgb(212, 136, 37);

      display: flex;

      margin-top: 10px;

      flex-direction: row;

      /* ye bhi by default hi h  */
      justify-content: center;
    }

    .container4 {
      height: 200px;
      width: 300px;

      background-color: rgb(215, 250, 220);

      display: flex;

      flex-direction: row;

      margin-top: 10px;

      /* ye space start end m rkhta h or half space rkhta h jitne box m hoti h usse  */
      justify-content: space-around;
    }

    .container5 {
      height: 200px;
      width: 300px;

      background-color: #5a22c8;

      display: flex;

      flex-direction: row;
      margin-top: 10px;

      /* ye box k beech me equal space kr deta h no space in start and end */
      justify-content: space-between;
    }

    .container6 {
      height: 200px;
      width: 300px;

      background-color: rgb(234, 120, 126);

      display: flex;

      flex-direction: row;

      margin-top: 10px;

      /*ye opposite h arround space ka start end m bhi same space rkhta hi h ye puri space me barabar element ko seprate krta h  
 */
      justify-content: space-evenly;
    }
    H1{
        text-align: 30PX ;
        text-decoration: dotted;
        color: ghostwhite;
    }
  </style>
  <body>
<h1>FLEX BOX JUSTIFY CONTENT</h1>

    <div class="container1">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
      <div class="box">D</div>
      <div class="box">E</div>
    </div>

    <div class="container2">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
      <div class="box">D</div>
      <div class="box">E</div>
    </div>

    <div class="container3">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
      <div class="box">D</div>
      <div class="box">E</div>
    </div>

    <div class="container4">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
      <div class="box">D</div>
      <div class="box">E</div>
    </div>

    <div class="container5">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
      <div class="box">D</div>
      <div class="box">E</div>
    </div>

    <div class="container6">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
      <div class="box">D</div>
      <div class="box">E</div>
    </div>
  </body>
</html>

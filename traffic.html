<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>navbar</title>
    <style>
      *{
        padding: 0%;
        margin: 0%;
      }
      body {
        background-color: rgb(171, 228, 228);
      }
      .nav {
        margin-top: 50px;
        height: 50px;
        width: 700px;
        background-color: black;
        padding: 20px 20px 20px 20px;
        border: 2px solid white;
      }
      .ele {
        height: 10px;
        width: 10px;
        color: white;
      }
      button {
        background-color: orange;
        color: white;
        border: 2px solid rgb(122, 122, 139);
      }
      .ele1 {
        height: 10px;
        width: 10px;
        color: white;
        margin-left: 100px;
      }
      .ele2 {
        height: 10px;
        width: 10px;
        color: white;
        margin-left: 200px;
      }
      .ele3 {
        height: 10px;
        width: 10px;
        color: white;
        margin-left: 300px;
      }
      .ele4 {
        height: 10px;
        width: 10px;
        color: white;
        margin-left: 400px;
      }

     
    div{
      display: inline;
    }
    </style>
  </head>
  <body>
    <div class="nav">
      <div class="ele">Amazon.in</div>

      <div class="ele1">Account</div>

      <div class="ele2">My Cart</div>

      <div class="ele3">Contact us</div>

      <div class="ele4">
        <input type="text" placeholder="Search here" />
        <button>Search</button>
      </div>

  </body>
</html>
